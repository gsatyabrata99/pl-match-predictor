[project]
name = "pl-match-predictor"
version = "0.1.0"
description = "Premier League match predictions from an expected-goals Poisson model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pl-predict = "predictor.build:main"

[tool.setuptools]
packages = ["predictor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
