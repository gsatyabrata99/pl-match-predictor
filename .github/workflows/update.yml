name: Update predictions and deploy

on:
  schedule:
    - cron: "17 6 * * *"     # daily, 06:17 UTC
    - cron: "17 16 * * *"    # and 16:17 UTC, so evening kickoffs get a same-day forecast
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data, rebuild predictions, record pre-kickoff forecasts
        run: python -m predictor.build --source auto --ledger

      - name: Record closing odds and results for finished matches
        run: python -m predictor.prospective market

      - name: Verify the ledger is append-only
        run: python -m predictor.ledger verify --base HEAD

      - name: Commit updated data and ledger
        run: |
          git add site/data
          if [ -d ledger ]; then git add ledger; fi
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update predictions $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
